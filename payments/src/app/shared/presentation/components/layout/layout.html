<div class="layout-container">
  <mat-toolbar class="toolbar">
    <mat-toolbar-row class="toolbar-row">
      <a [routerLink]="'/home'" class="logo">
        <span class="logo-skill">Skill</span><span class="logo-swap">Swap</span>
      </a>

      <div class="mat-spacer"></div>

      <nav class="nav-links">
        @for (option of options; track option.label) {
          <a mat-button [routerLink]="option.link" routerLinkActive="active" class="nav-link">
            {{ option.label | translate }}
          </a>
        }
      </nav>

      <div class="toolbar-actions">
        <button mat-icon-button class="action-icon">
          <mat-icon>search</mat-icon>
        </button>

        <button mat-icon-button class="action-icon">
          <mat-icon matBadge=" " matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
        </button>

        <app-language-switcher/>

        <div class="user-section">
          <div class="avatar-container">
            <div class="avatar-circle">
              <mat-icon>person</mat-icon>
            </div>
          </div>
          <button mat-flat-button class="logout-btn">Cerrar sesión</button>
        </div>
      </div>

    </mat-toolbar-row>
  </mat-toolbar>

  <main class="main-content">
    <router-outlet/>
  </main>

  <app-footer-content/>
</div>
