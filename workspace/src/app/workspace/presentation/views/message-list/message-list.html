@if (store.loading()) {
<div class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>
}

@if (store.error()) {
<mat-error class="error-message">{{ store.error() }}</mat-error>
}

<div class="table-container">
  <table mat-table [dataSource]="store.messages()" class="mat-elevation-z8 custom-table">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let message"> {{ message.id }} </td>
    </ng-container>

    <!-- Content Column -->
    <ng-container matColumnDef="content">
      <th mat-header-cell *matHeaderCellDef> Content </th>
      <td mat-cell *matCellDef="let message"> {{ message.content }} </td>
    </ng-container>

    <!-- SenderID Column -->
    <ng-container matColumnDef="senderId">
      <th mat-header-cell *matHeaderCellDef> Sender ID </th>
      <td mat-cell *matCellDef="let message"> {{ message.senderId }} </td>
    </ng-container>

    <!-- Session Column -->
    <ng-container matColumnDef="session">
      <th mat-header-cell *matHeaderCellDef> Session </th>
      <td mat-cell *matCellDef="let message">
        {{ message.session?.topic ?? ('Session #' + message.sessionId) }}
      </td>
    </ng-container>

    <!-- SentAt Column -->
    <ng-container matColumnDef="sentAt">
      <th mat-header-cell *matHeaderCellDef> Sent At </th>
      <td mat-cell *matCellDef="let message"> {{ message.sentAt }} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let message">
        <button mat-button color="primary" (click)="editMessage(message.id)">Edit</button>
        <button mat-button color="warn" (click)="deleteMessage(message.id)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
  </table>
</div>

<div class="button-container">
  <button mat-raised-button color="primary"
          (click)="router.navigate(['workspace/messages/new'])">
    Add Message
  </button>
</div>
